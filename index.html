<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />

  <script type="module" src="https://static.cloud.coveo.com/atomic/v3/atomic.esm.js"></script>
  <link rel="stylesheet" href="https://static.cloud.coveo.com/atomic/v3/themes/coveo.css" />
</head>

<body>
  <atomic-generated-answer></atomic-generated-answer>
  <atomic-search-interface
  id="search"
  fields-to-include='["pokemon_type","pokemon_generation","pokemon_image"]'>
    <atomic-search-layout>
      <atomic-layout-section section="search">
        <atomic-search-box></atomic-search-box>
      </atomic-layout-section>
	  <atomic-layout-section section="facets">
        <atomic-facet
          field="pokemon_type"
          label="Pokémon Type">
        </atomic-facet>

        <atomic-facet
          field="pokemon_generation"
          label="Generation">
        </atomic-facet>
      </atomic-layout-section>
        <atomic-layout-section section="main">
          <atomic-did-you-mean></atomic-did-you-mean>
          <atomic-query-summary></atomic-query-summary>
          <atomic-no-results></atomic-no-results>
		  <atomic-generated-answer></atomic-generated-answer>
		  <atomic-result-list image-size="large">
			<atomic-result-template>
			  <template>
				<atomic-result-section-visual>
					<atomic-result-image field="pokemon_image"></atomic-result-image>
				</atomic-result-section-visual>

				<atomic-result-section-title>
				  <atomic-result-link></atomic-result-link>
				</atomic-result-section-title>

				<atomic-result-section-metadata>
					<atomic-result-text field="pokemon_type"></atomic-result-text>
					<atomic-result-text field="pokemon_generation"></atomic-result-text>
				</atomic-result-section-metadata>
			  </template>
			</atomic-result-template>
		  </atomic-result-list>
        <atomic-pager></atomic-pager>
      </atomic-layout-section>
    </atomic-search-layout>
  </atomic-search-interface>

  <script>
    (async () => {
      await customElements.whenDefined('atomic-search-interface');

      const searchInterface = document.querySelector('#search');

      await searchInterface.initialize({
        accessToken: 'xxa44ec475-63b7-401c-83ef-aad3cee9382d',
        organizationId: 'pu7ptzbbyf643n7sjsyrckfkpga'
      });
	  
      searchInterface.executeFirstSearch();
    })();
  </script>
</body>
</html>
